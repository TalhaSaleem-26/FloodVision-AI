[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodvision"
version = "0.1.0"
description = "CNN-based satellite flood mapping and geospatial analysis"
requires-python = ">=3.11,<3.13"

dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "rasterio",
    "opencv-python",
    "albumentations",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "google-cloud-storage"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]